name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/EasyCulling-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EasyCulling-apk
          path: out/*.apk

      - name: Publish as a GitHub release (direct download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Easy Culling 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "Built from ${{ github.ref_name }} @ ${{ github.sha }}. Download the .apk below on your phone and open it to install/update."
          files: out/*.apk
          make_latest: true
