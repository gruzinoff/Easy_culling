name: probe-versions
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Latest versions on Google Maven
        run: |
          for a in com/android/tools/build/gradle androidx/compose/compose-bom androidx/activity/activity-compose androidx/navigation/navigation-compose androidx/lifecycle/lifecycle-runtime-compose androidx/lifecycle/lifecycle-viewmodel-compose androidx/exifinterface/exifinterface androidx/core/core-ktx androidx/compose/material3/material3 androidx/compose/ui/ui androidx/compose/material/material-icons-extended; do
            v=$(curl -s "https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml" | grep -o '<version>[^<]*' | sed 's/<version>//' | grep -vE 'alpha|beta|rc|dev' | tail -4 | tr '\n' ' ')
            echo "VERSIONS $a: $v"
          done
          ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools
